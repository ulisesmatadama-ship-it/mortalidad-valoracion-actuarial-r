name: Verificar R
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - name: Comprobaciones actuariales
        run: Rscript --vanilla tests/verificar.R
      - name: Ejecutar demostracion
        run: Rscript --vanilla scripts/ejecutar.R
